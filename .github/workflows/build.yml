name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Testes
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/macread.exe, target/release/macread-gui.exe, abrir-como-admin.cmd, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath macread-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: macread-windows-x64
          path: |
            target/release/macread.exe
            target/release/macread-gui.exe
            macread-windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/macread.exe
            target/release/macread-gui.exe
            macread-windows-x64.zip
